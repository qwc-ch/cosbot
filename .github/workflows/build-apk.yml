name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile (preview / production)
        required: false
        default: preview
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build android (${{ inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize file permissions
        # 部分环境 umask 较严，Metro 的文件扫描可能扫不到 node_modules
        run: chmod -R u+rwX,go+rX node_modules

      - name: Type check
        run: npx tsc --noEmit

      - name: Check EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::缺少 EXPO_TOKEN。请在 Settings → Secrets and variables → Actions 里添加。"
            exit 1
          fi
          echo "EXPO_TOKEN 已配置"

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start build
        id: start
        run: |
          eas build \
            --platform android \
            --profile "${{ inputs.profile || 'preview' }}" \
            --non-interactive \
            --json > build-info.json
          BUILD_ID="$(node -e "console.log(require('./build-info.json').id)")"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Started EAS build $BUILD_ID"

      - name: Wait for build
        run: eas build:wait --id "${{ steps.start.outputs.BUILD_ID }}" --non-interactive

      - name: Download artifact
        run: |
          mkdir -p artifacts
          eas build:download \
            --id "${{ steps.start.outputs.BUILD_ID }}" \
            --platform android \
            --output artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cosbot-apk-${{ inputs.profile || 'preview' }}
          path: artifacts/*
          if-no-files-found: error
