name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        required: false
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate Android project
        # prebuild 根据 app.json 生成原生工程；--no-install 避免重复装依赖
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK
        run: |
          cd android
          ./gradlew assemble${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }} \
            --no-daemon \
            --stacktrace

      - name: Locate APK
        id: apk
        run: |
          TYPE="${{ inputs.build_type == 'debug' && 'debug' || 'release' }}"
          APK=$(find android/app/build/outputs/apk/$TYPE -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::未找到 APK 产物"
            ls -R android/app/build/outputs/apk 2>&1 || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cosbot-apk-${{ inputs.build_type || 'release' }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
