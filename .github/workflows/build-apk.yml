name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        required: false
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建/更新 Release 及上传附件
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate Android project
        # prebuild 根据 app.json 生成原生工程；--no-install 避免重复装依赖
        run: npx expo prebuild --platform android --no-install

      - name: Ensure gradlew is executable
        # /android 未纳入版本管理，prebuild 生成的文件可能缺少执行位
        run: chmod +x android/gradlew

      - name: Cache Gradle build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK
        run: |
          cd android
          ./gradlew assemble${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }} \
            --no-daemon \
            --stacktrace

      - name: Locate APK
        id: apk
        run: |
          TYPE="${{ inputs.build_type == 'debug' && 'debug' || 'release' }}"
          APK=$(find android/app/build/outputs/apk/$TYPE -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::未找到 APK 产物"
            ls -R android/app/build/outputs/apk 2>&1 || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          # 确认 app.json 的 buildArchs 确实生效
          echo "reactNativeArchitectures: $(grep reactNativeArchitectures android/gradle.properties || echo '(未设置)')"
          echo "包含的 ABI:"
          unzip -l "$APK" | grep -oE 'lib/[a-z0-9_-]+/' | sort -u

      - name: Rename APK
        # 给 APK 带上版本号，下载时一眼能看出对应哪个版本
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="${GITHUB_REF#refs/tags/v}" ;;
            *)             VERSION="${GITHUB_SHA::7}" ;;
          esac
          # 文件名里不能出现斜杠等字符
          VERSION="${VERSION//[^A-Za-z0-9._-]/_}"
          cp "${{ steps.apk.outputs.path }}" "cosbot-${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APK: cosbot-${VERSION}.apk ($(du -h "cosbot-${VERSION}.apk" | cut -f1))"

      - name: Upload APK as artifact
        # 保留 Artifacts 作为兜底：无需 Release 权限的临时下载途径，30 天过期
        uses: actions/upload-artifact@v4
        with:
          name: cosbot-apk-${{ inputs.build_type || 'release' }}
          path: cosbot-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Release
        # 仅打 tag 时发布；手动触发（无 tag）时跳过
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # 同名 Release 已存在则只更新附件，否则新建
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新 APK 附件"
            gh release upload "$TAG" cosbot-*.apk --clobber
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" cosbot-*.apk \
              --title "cosbot $TAG" \
              --generate-notes
          fi
