name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        required: false
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'

# 每个 ABI 一个 job，并行构建，最后汇总成一份 Release
jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建/更新 Release 及上传附件
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate Android project
        # prebuild 根据 app.json 生成原生工程；--no-install 避免重复装依赖
        run: npx expo prebuild --platform android --no-install

      - name: Ensure gradlew is executable
        # /android 未纳入版本管理，prebuild 生成的文件可能缺少执行位
        run: chmod +x android/gradlew

      - name: Cache Gradle build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('android/**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK
        # -PreactNativeArchitectures 只打当前 ABI，
        # 这样 release 里不会再混入另一个架构的 .so
        run: |
          cd android
          ./gradlew assemble${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }} \
            -PreactNativeArchitectures=${{ matrix.abi }} \
            --no-daemon \
            --stacktrace

      - name: Verify and rename APK
        id: apk
        run: |
          TYPE="${{ inputs.build_type == 'debug' && 'debug' || 'release' }}"
          APK=$(find android/app/build/outputs/apk/$TYPE -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::未找到 APK 产物"
            ls -R android/app/build/outputs/apk 2>&1 || true
            exit 1
          fi
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          # 确认 APK 里只有预期的 ABI，CI 上把结果打出来便于排查
          echo "包含的 ABI:"
          unzip -l "$APK" | grep -oE 'lib/[a-z0-9_-]+/' | sort -u
          # 没开 shrinkResources 时资源目录会明显偏大，这里给出体积分解
          echo "体积分解:"
          unzip -l "$APK" | awk '
            /lib\/.*\.so$/ { so += $1 }
            /assets\// { asset += $1 }
            /classes.*\.dex$/ { dex += $1 }
            /res\// { res += $1 }
            END {
              printf "  native .so  %6.1f MB\n", so/1048576
              printf "  assets      %6.1f MB\n", asset/1048576
              printf "  dex         %6.1f MB\n", dex/1048576
              printf "  res         %6.1f MB\n", res/1048576
            }'

          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="${GITHUB_REF#refs/tags/v}" ;;
            *)             VERSION="${GITHUB_SHA::7}" ;;
          esac
          VERSION="${VERSION//[^A-Za-z0-9._-]/_}"
          OUT="cosbot-$VERSION-${{ matrix.abi }}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APK: $OUT ($(du -h "$OUT" | cut -f1))"

      - name: Upload APK as artifact
        # 保留 Artifacts 作为兜底：无需 Release 权限的临时下载途径，30 天过期
        uses: actions/upload-artifact@v4
        with:
          name: cosbot-${{ matrix.abi }}-${{ inputs.build_type || 'release' }}
          path: cosbot-*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish APKs to Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create --generate-notes 依赖 git 仓库来算 tag 之间的差异，
      # 没有 checkout 会报 "not a git repository"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --generate-notes 需要完整历史来生成变更日志

      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          pattern: cosbot-*-release
          path: apks
          merge-multiple: true

      - name: List APKs
        run: ls -lh apks

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          BODY=$(cat <<EOF
          按 CPU 架构分开下载，装哪个看手机型号：

          - \`arm64-v8a\`：**绝大多数现代手机**（2017 年后基本都是），选这个
          - \`armeabi-v7a\`：老旧 32 位手机，实在不确定就试这个

          两个都能装的话选 arm64-v8a，包更小、运行更快。
          EOF
          )
          # 同名 Release 已存在则只更新附件，否则新建
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新 APK 附件"
            gh release upload "$TAG" apks/*.apk --clobber
            gh release edit "$TAG" --notes "$BODY" || true
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" apks/*.apk \
              --title "cosbot $TAG" \
              --notes "$BODY" \
              --generate-notes
          fi